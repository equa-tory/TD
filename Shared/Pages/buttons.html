<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, Arial; }
        #buttons { display: flex; flex-wrap: wrap; height: 100vh; }
        #buttons button {
            flex: 1 1 300px;
            min-height: 100px;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #f0f4ff;
        }
        #buttons button:hover { background: #dce6ff; }
        #buttons button:active { background: #b3c8ff; }
        #buttons button.printing { opacity: 0.6; cursor: wait; }
        .loading { padding: 20px; color: #666; }
        .error   { padding: 20px; color: #c00; }
    </style>
</head>
<body>
    <div id="buttons"><span class="loading">Loading...</span></div>

    <script type="text/javascript">
        function fetchTypes() {
            var container = document.getElementById('buttons');
            container.innerHTML = '<span class="loading">Loading ticket types...</span>';
            try {
                var json = window.external.FetchSomething();
                var data;
                try { data = JSON.parse(json); } catch(e) { data = eval('(' + json + ')'); }

                if (data && data.error) {
                    container.innerHTML = '<span class="error">Error: ' + data.error + '</span>';
                    return;
                }

                var list = data;
                if (!(list instanceof Array)) {
                    if (data.results)      list = data.results;
                    else if (data.types)   list = data.types;
                    else                   list = [data];
                }

                container.innerHTML = '';

                if (list.length === 0) {
                    container.innerHTML = '<span class="loading">No ticket types found.</span>';
                    return;
                }

                for (var i = 0; i < list.length; i++) {
                    var item  = list[i];
                    // always pass string to C# — avoids COM type mismatch
                    var id    = String(item.id || item.slug || item.name || i);
                    var title = item.title || item.name || item.display_name || id;

                    var btn = document.createElement('button');
                    btn.innerText = title;

                    (function(tid, ttitle) {
                        btn.onclick = function() {
                            var me = this;
                            me.disabled = true;
                            me.className = 'printing';
                            try {
                                var result = window.external.ButtonPress(tid, ttitle);
                                if (result && result.indexOf('error:') === 0) {
                                    alert('Print error: ' + result.substring(6));
                                }
                            } catch(e) {
                                alert('ButtonPress failed: ' + e.message);
                            }
                            // re-enable after short delay
                            setTimeout(function() {
                                me.disabled  = false;
                                me.className = '';
                            }, 1500);
                        };
                    })(id, title);

                    container.appendChild(btn);
                }
            } catch(e) {
                container.innerHTML = '<span class="error">' + e.message + '</span>';
            }
        }

        fetchTypes();
    </script>
</body>
</html>
