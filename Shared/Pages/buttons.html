<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; -ms-user-select: none; }
        #buttons { width: 100%; height: 100%; }
        .btnwrap { float: left; }
        .btnwrap button {
            width: 100%; height: 100%;
            font-size: 24px; cursor: pointer;
            background: #f0f4ff; border: 1px solid #ccc;
            font-family: Segoe UI, Arial;
        }
        .btnwrap button:hover   { background: #dce6ff; }
        .btnwrap button:active  { background: #b3c8ff; }
        .btnwrap button.printing { background: #ccc; cursor: wait; }
        .msg { padding: 20px; font-family: Arial; font-size: 14px; }
        .loading { color: #666; }
        .error   { color: #c00; }
    </style>
</head>
<body>
<div id="buttons"><span class="msg loading">Loading...</span></div>

<script type="text/javascript">
    function calcGrid(count) {
        var cols = Math.ceil(Math.sqrt(count));
        var rows = Math.ceil(count / cols);
        return { cols: cols, rows: rows };
    }

    function renderButtons(list) {
        var container = document.getElementById('buttons');
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = '<span class="msg loading">No ticket types found.</span>';
            return;
        }

        var g = calcGrid(list.length);
        var w = Math.floor(100 / g.cols);
        var h = Math.floor(100 / g.rows);

        for (var i = 0; i < list.length; i++) {
            var item  = list[i];
            var id    = String(item.id || item.slug || item.name || i);
            var title = item.title || item.name || item.display_name || id;

            var wrap = document.createElement('div');
            wrap.className    = 'btnwrap';
            wrap.style.width  = w + '%';
            wrap.style.height = h + '%';

            var btn = document.createElement('button');
            btn.innerHTML = escHtml(title);

            (function(tid, ttitle, b) {
                b.onclick = function() {
                    if (b.disabled) return;
                    b.disabled  = true;
                    b.className = 'printing';
                    try {
                        var result = window.external.ButtonPress(tid, ttitle);
                        if (result && result.indexOf('error:') === 0)
                            alert('Print error: ' + result.substring(6));
                    } catch(e) {
                        alert('ButtonPress failed: ' + e.message);
                    }
                    setTimeout(function() {
                        b.disabled  = false;
                        b.className = '';
                    }, 1500);
                };
            })(id, title, btn);

            wrap.appendChild(btn);
            container.appendChild(wrap);
        }
    }

    function fetchTypes() {
        var container = document.getElementById('buttons');
        container.innerHTML = '<span class="msg loading">Loading...</span>';
        try {
            var json = window.external.FetchSomething();
            var data;
            try { data = JSON.parse(json); } catch(e) { data = eval('(' + json + ')'); }

            if (data && data.error) {
                container.innerHTML = '<span class="msg error">Error: ' + escHtml(data.error) + '</span>';
                return;
            }

            var list = data;
            if (!(list instanceof Array)) {
                if (data.results)    list = data.results;
                else if (data.types) list = data.types;
                else                 list = [data];
            }

            renderButtons(list);
        } catch(e) {
            container.innerHTML = '<span class="msg error">' + escHtml(e.message) + '</span>';
        }
    }

    function escHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // disable text selection on XP/IE
    document.onselectstart = function() { return false; };

    fetchTypes();
</script>
</body>
</html>
