<!DOCTYPE html>
<html>
<head>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
#buttons { width: 100%; height: 100%; }
.btnwrap { float: left; }
.btnwrap button {
    width: 100%; height: 100%;
    font-size: 24px; cursor: pointer;
    background: #f0f4ff; border: 1px solid #ccc;
}
.btnwrap button:hover  { background: #dce6ff; }
.btnwrap button:active { background: #b3c8ff; }
.loading { padding: 20px; color: #666; }
.error   { padding: 20px; color: #c00; }
</style>
</head>
<body>
<div id="buttons"><span class="loading">Loading...</span></div>

<script type="text/javascript">
    var fullscreen = false;

    function calcGrid(count) {
        // find cols/rows that give squarish buttons
        var cols = Math.ceil(Math.sqrt(count));
        var rows = Math.ceil(count / cols);
        return { cols: cols, rows: rows };
    }

    function renderButtons(list) {
        var container = document.getElementById('buttons');
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = '<span class="loading">No ticket types found.</span>';
            return;
        }

        var g = calcGrid(list.length);
        var w = Math.floor(100 / g.cols);
        var h = Math.floor(100 / g.rows);

        for (var i = 0; i < list.length; i++) {
            var item  = list[i];
            var id    = String(item.id || item.slug || item.name || i);
            var title = item.title || item.name || item.display_name || id;

            var wrap = document.createElement('div');
            wrap.className = 'btnwrap';
            wrap.style.width  = w + '%';
            wrap.style.height = h + '%';

            var btn = document.createElement('button');
            btn.innerText = title;

            (function(tid, ttitle, b) {
                b.onclick = function() {
                    b.disabled = true;
                    b.className = 'printing';
                    try {
                        var result = window.external.ButtonPress(tid, ttitle);
                        if (result && result.indexOf('error:') === 0)
                            alert('Print error: ' + result.substring(6));
                    } catch(e) {
                        alert('ButtonPress failed: ' + e.message);
                    }
                    setTimeout(function() {
                        b.disabled = false;
                        b.className = '';
                    }, 1500);
                };
            })(id, title, btn);

            wrap.appendChild(btn);
            container.appendChild(wrap);
        }
    }

    function fetchTypes() {
        var container = document.getElementById('buttons');
        container.innerHTML = '<span class="loading">Loading...</span>';
        try {
            var json = window.external.FetchSomething();
            var data;
            try { data = JSON.parse(json); } catch(e) { data = eval('(' + json + ')'); }
            if (data && data.error) {
                container.innerHTML = '<span class="error">Error: ' + data.error + '</span>';
                return;
            }
            var list = data;
            if (!(list instanceof Array)) {
                if (data.results)    list = data.results;
                else if (data.types) list = data.types;
                else                 list = [data];
            }
            renderButtons(list);
        } catch(e) {
            container.innerHTML = '<span class="error">' + e.message + '</span>';
        }
    }

    document.onkeydown = function(e) {
        e = e || window.event;

        var code = e.keyCode || e.which;

        if (code === 122) { // F11
            if (e.preventDefault)
                e.preventDefault();

            e.returnValue = false;

            fullscreen = !fullscreen;
            window.external.SetFullscreen(fullscreen);
            // save
            window.external.SaveConfig('fullscreen',  fullscreen);

            return false;
        }
    };

    if (window.external.GetConfig('fullscreen')) {
        fullscreen = window.external.GetConfig('fullscreen');
        window.external.SetFullscreen(fullscreen);
    }
    fetchTypes();
</script>
</body>
</html>
