<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Segoe UI, Arial; background: #f0f0f0; height: 100vh; display: flex; flex-direction: column; }

        #menubar { background: #2c2c2c; flex-shrink: 0; }
        #menubar button { background: none; border: none; color: #fff; padding: 8px 16px; font-size: 13px; cursor: pointer; }
        #menubar button:hover { background: #444; }
        #menubar button.active { background: #555; }

        .page { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .page.active { display: flex; }

        #currentTicket {
            display: none;
            background: #e8f4fd;
            border-bottom: 1px solid #b3d7f0;
            padding: 8px 14px;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* ── Action bar ── */
        #actionbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 8px 12px;
            flex-shrink: 0;
        }
        #btn-next {
            background: #0078d4;
            color: #fff;
            border: none;
            padding: 10px 28px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }
        #btn-next:hover { background: #005fa3; }
        #btn-next:active { background: #004c85; }

        .action-group { display: flex; gap: 6px; }
        .action-group button {
            border: 1px solid #bbb;
            background: #f5f5f5;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 3px;
        }
        .action-group button:hover { background: #e5e5e5; }
        .action-group button.btn-served  { border-color: #107c10; color: #107c10; }
        .action-group button.btn-notserved { border-color: #d83b01; color: #d83b01; }
        .action-group button.btn-missed  { border-color: #8764b8; color: #8764b8; }
        .action-group button.btn-gong    { border-color: #c19c00; color: #986f00; }
        .action-group button:disabled { opacity: 0.4; cursor: default; }

        /* ── Tabs ── */
        #tabs-bar {
            display: flex;
            background: #fff;
            border-bottom: 1px solid #ccc;
            flex-shrink: 0;
        }
        .tab-btn {
            padding: 8px 20px;
            border: none;
            background: none;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: #555;
        }
        .tab-btn.active { border-bottom-color: #0078d4; color: #0078d4; font-weight: bold; }

        /* ── List ── */
        #list-area { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .tab-list { display: none; flex: 1; overflow-y: auto; }
        .tab-list.active { display: block; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead { position: sticky; top: 0; background: #e8e8e8; }
        th { text-align: left; padding: 7px 12px; font-weight: 600; color: #333; border-bottom: 1px solid #ccc; }
        td { padding: 6px 12px; border-bottom: 1px solid #eee; }
        tr.selected td { background: #cce4f7; }
        tr:hover td { background: #f0f0f0; }
        tr.selected:hover td { background: #b8d9f2; }

        .result-served    { color: #107c10; }
        .result-notserved { color: #d83b01; }
        .result-missed    { color: #8764b8; }
        .result-pending   { color: #888; }

        #hint { padding: 6px 12px; font-size: 11px; color: #888; background: #fafafa; border-top: 1px solid #eee; flex-shrink: 0; }

        /* ── Config / Batch pages ── */
        .form-page { padding: 16px; overflow-y: auto; flex: 1; }
        label { display: block; margin-top: 12px; margin-bottom: 4px; font-size: 13px; }
        input, select { padding: 6px; width: 314px; font-size: 14px; }
        .btn { margin: 12px 4px 0 0; padding: 8px 14px; cursor: pointer; font-size: 13px; }
        .status { margin-top: 10px; color: green; display: none; font-size: 13px; }
    </style>
</head>
<body>

<div id="menubar">
    <button onclick="showPage('manager')" class="active" id="nav-manager">Manager</button>
    <button onclick="showPage('config')" id="nav-config">Config</button>
    <button onclick="showPage('batch')"  id="nav-batch">Batch Tickets</button>
</div>

<!-- ══ Manager page ══════════════════════════════════════════════════════ -->
<div id="page-manager" class="page active">

    <div id="currentTicket">
        <!-- Show current ticket id, time -->
    </div>

    <div id="actionbar">
        <button id="btn-next" onclick="callNext()">&#9654; Next</button>
        <div class="action-group">
            <button class="btn-served"    onclick="setServingStatus('served')"    id="ab-served">&#10003; Served</button>
            <button class="btn-notserved" onclick="setServingStatus('not_served')" id="ab-notserved">&#10007; Not served</button>
            <button class="btn-missed"    onclick="setServingStatus('not_come')"  id="ab-missed">&#9888; Missed</button>
            <button class="btn-gong"      onclick="gong()"                    id="ab-gong">&#9679; Gong</button>
        </div>
    </div>

    <div id="tabs-bar">
        <button class="tab-btn active" onclick="showTab('queue')"   id="tab-queue">Queue</button>
        <button class="tab-btn"        onclick="showTab('history')" id="tab-history">History</button>
    </div>

    <div id="list-area">
        <div class="tab-list active" id="list-queue">
            <table>
                <thead><tr><th>#</th><th>Number</th><th>Called at</th><th>Status</th></tr></thead>
                <tbody id="tbody-queue"></tbody>
            </table>
        </div>
        <div class="tab-list" id="list-history">
            <table>
                <thead><tr><th>#</th><th>Number</th><th>Called at</th><th>Result</th></tr></thead>
                <tbody id="tbody-history"></tbody>
            </table>
        </div>
    </div>

    <!-- <div id="hint">Click to select &bull; Shift+click to multi-select &bull; Delete to remove selected</div> -->
</div>

<!-- ══ Config page ═══════════════════════════════════════════════════════ -->
<div id="page-config" class="page">
    <div class="form-page">
        <h3 style="margin-bottom:8px;">Config</h3>
        <label>API URL:</label>
        <input type="text" id="apiUrl" placeholder="http://example.com/api" />
        <label>Ticket refresh rate:</label>
        <input type="text" id="refreshRate" placeholder="3000" />
        <label>Printer:</label>
        <select id="printer"><option value="">— No printer —</option></select>
        <div id="printerDebug" style="color:red;font-size:12px;margin-top:4px;"></div>
        <button class="btn" onclick="toggleDebug()" id="debugBtn">Debug Print: ...</button>
        <br />
        <button class="btn" onclick="saveConfig()">Save</button>
        <button class="btn" onclick="loadCurrent()">Reload</button>
        <div class="status" id="status">Saved!</div>
    </div>
</div>

<!-- ══ Batch page ════════════════════════════════════════════════════════ -->
<div id="page-batch" class="page">
    <div class="form-page">
        <h3 style="margin-bottom:8px;">Batch Tickets</h3>
        <label>Ticket Type:</label>
        <select id="ticketType"><option value="">— loading... —</option></select>
        <label>Count:</label>
        <input type="number" id="count" value="1" min="1" max="100" style="width:100px;" />
        <br />
        <button class="btn" onclick="createBatch()">Create Tickets</button>
        <div id="batchStatus" class="status"></div>
    </div>
</div>

<script type="text/javascript">

    // ── State ──────────────────────────────────────────────────────────────
    var queue   = [];   // { id, number, calledAt, status }
    var history = [];
    var lastSelected = null;   // index for shift-click range
    var refreshTimer = null;
    var REFRESH_MS   = 3000; // poll every 3 seconds
    var servingTicket = null; // { id, number, calledAt }
    
    function loadTickets() {
        var dbgEl = document.getElementById('printerDebug'); // reuse as debug output temporarily
        try {
            var raw  = window.external.GetTickets();
            var data = eval('(' + raw + ')');
            var list = data;
            if (!(list instanceof Array)) {
                list = data.tickets || data.results || data.items || [data];
            }

            var newQueue   = [];
            var newHistory = [];
            var newServing = null;

            for (var i = 0; i < list.length; i++) {
                var t      = list[i];
                var status = (t.status || '').toLowerCase();
                var entry  = {
                    id:       String(t.id || i),
                    number:   t.name || t.number || t.display_number || ('T-' + i),
                    calledAt: t.created_at ? formatDate(t.created_at) : '',
                    status:   status,
                    selected: false
                };
                if (status === 'serving') {
                    newServing = entry;
                } else if (status === 'active') {
                    entry.selected = isSelected('queue', entry.id);
                    newQueue.push(entry);
                } else {
                    entry.selected = isSelected('history', entry.id);
                    newHistory.push(entry);
                }
            }

            servingTicket = newServing;
            queue         = newQueue;
            history       = newHistory;

            try { renderServing(); } catch(e) { alert('renderServing: ' + e.message); }
            try { renderQueue();   } catch(e) { alert('renderQueue: '   + e.message); }
            try { renderHistory(); } catch(e) { alert('renderHistory: ' + e.message); }
            try { updateButtons(); } catch(e) { alert('updateButtons: ' + e.message); }

        } catch(e) {
            // show error in queue table so you can see what's wrong
            var tb = document.getElementById('tbody-queue');
            alert('loadTickets error: ' + e.message);
            // if (tb) tb.innerHTML = '<tr><td colspan="4" style="color:red;padding:8px;">loadTickets error: ' + e.message + '</td></tr>';
        }
    }

    function renderServing() {
        var el = document.getElementById('currentTicket');
        if (!servingTicket) {
            el.innerHTML = '';
            el.style.display = 'none';
            return;
        }
        el.style.display = 'block';
        el.innerHTML =
            '<span style="font-weight:bold;font-size:15px;">' + escHtml(servingTicket.number) + '</span>' +
            '<span style="color:#888;font-size:12px;margin-left:10px;">serving since ' + escHtml(servingTicket.calledAt) + '</span>';
    }

    function updateButtons() {
        var hasServing = servingTicket !== null;
        var hasQueue   = queue.length > 0;

        document.getElementById('btn-next').disabled      = !hasQueue && !hasServing;
        document.getElementById('ab-served').disabled     = !hasServing;
        document.getElementById('ab-notserved').disabled  = !hasServing;
        document.getElementById('ab-missed').disabled     = !hasServing;
        document.getElementById('ab-gong').disabled       = !hasServing;
    }
    
    // ── Navigation ─────────────────────────────────────────────────────────
    // update showPage to pause/resume:
    function showPage(name) {
        var ids = ['manager','config','batch'];
        for (var i = 0; i < ids.length; i++) {
            document.getElementById('page-' + ids[i]).className = 'page';
            document.getElementById('nav-'  + ids[i]).className = '';
        }
        document.getElementById('page-' + name).className = 'page active';
        document.getElementById('nav-'  + name).className = 'active';

        if (name === 'manager') { startRefresh(); }
        else                    { stopRefresh();  }

        if (name === 'batch')   loadTypes();
        if (name === 'config')  loadCurrent();
    }

    function showTab(name) {
        document.getElementById('list-queue').className   = 'tab-list' + (name==='queue'   ? ' active' : '');
        document.getElementById('list-history').className = 'tab-list' + (name==='history' ? ' active' : '');
        document.getElementById('tab-queue').className    = 'tab-btn'  + (name==='queue'   ? ' active' : '');
        document.getElementById('tab-history').className  = 'tab-btn'  + (name==='history' ? ' active' : '');
        lastSelected = null;
    }

    function isSelected(listName, id) {
        var data = listName === 'queue' ? queue : history;
        for (var i = 0; i < data.length; i++) {
            if (data[i].id === id && data[i].selected) return true;
        }
        return false;
    }

    // ── Realtime polling ──────────────────────────────────────────────────
    function startRefresh() {
        stopRefresh(); // prevent double timers if called multiple times
        loadTickets();
        var rate = parseInt(window.external.GetConfig('refreshRate'), 10);
        if (isNaN(rate) || rate < 500) rate = REFRESH_MS;
        refreshTimer = setInterval(loadTickets, rate);
    }

    function stopRefresh() {
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    }

    // ── Queue rendering ────────────────────────────────────────────────────
function renderQueue() {
    var tb = document.getElementById('tbody-queue');
    while (tb.rows.length > 0) tb.deleteRow(0); // IE-safe clear
    for (var i = 0; i < queue.length; i++) {
        var r  = queue[i];
        var tr = tb.insertRow(-1);
        if (r.selected) tr.className = 'selected';
        tr.setAttribute('data-id',   r.id);
        tr.setAttribute('data-list', 'queue');
        tr.onclick       = function(e) { rowClick(e, this); };
        tr.oncontextmenu = function(e) {
            var id = this.getAttribute('data-id');
            var listName = this.getAttribute('data-list');
            var data = listName === 'queue' ? queue : history;
            var alreadySelected = false;
            for (var k = 0; k < data.length; k++) {
                if (data[k].id === id && data[k].selected) { alreadySelected = true; break; }
            }
            if (!alreadySelected) rowClick(e, this);
            showCtxMenu(e, listName);
        };
        var c0 = tr.insertCell(0); c0.innerHTML = (i+1);
        var c1 = tr.insertCell(1); c1.innerHTML = '<b>' + escHtml(r.number) + '</b>';
        var c2 = tr.insertCell(2); c2.innerHTML = escHtml(r.calledAt);
        var c3 = tr.insertCell(3); c3.innerHTML = 'waiting';
        c3.className = 'result-pending';
    }
}

function renderHistory() {
    var tb = document.getElementById('tbody-history');
    while (tb.rows.length > 0) tb.deleteRow(0); // IE-safe clear
    for (var i = 0; i < history.length; i++) {
        var r     = history[i];
        var cls   = r.status === 'served'     ? 'result-served'
                  : r.status === 'not_served' ? 'result-notserved'
                  : r.status === 'not_come'   ? 'result-missed' : '';
        var label = r.status === 'served'     ? 'served'
                  : r.status === 'not_served' ? 'not served'
                  : r.status === 'not_come'   ? 'missed' : r.status;
        var tr = tb.insertRow(-1);
        if (r.selected) tr.className = 'selected';
        tr.setAttribute('data-id',   r.id);
        tr.setAttribute('data-list', 'history');
        tr.onclick       = function(e) { rowClick(e, this); };
        tr.oncontextmenu = function(e) {
            var id = this.getAttribute('data-id');
            var listName = this.getAttribute('data-list');
            var data = listName === 'queue' ? queue : history;
            var alreadySelected = false;
            for (var k = 0; k < data.length; k++) {
                if (data[k].id === id && data[k].selected) { alreadySelected = true; break; }
            }
            if (!alreadySelected) rowClick(e, this);
            showCtxMenu(e, listName);
        };
        var c0 = tr.insertCell(0); c0.innerHTML = (i+1);
        var c1 = tr.insertCell(1); c1.innerHTML = '<b>' + escHtml(r.number) + '</b>';
        var c2 = tr.insertCell(2); c2.innerHTML = escHtml(r.calledAt);
        var c3 = tr.insertCell(3); c3.innerHTML = escHtml(label);
        c3.className = cls;
    }
}

    // ── Row selection — now uses data-id instead of data-idx ──────────────
    function rowClick(e, tr) {

        e = e || window.event;

        var shift = e && e.shiftKey;

        var listName = tr.getAttribute('data-list');
        var id       = tr.getAttribute('data-id');

        var data = listName === 'queue' ? queue : history;

        var idx = -1;

        for (var k = 0; k < data.length; k++) {
            if (data[k].id === id) {
                idx = k;
                break;
            }
        }

        if (idx < 0) return;

        if (shift && lastSelected !== null && lastSelected.list === listName) {

            var from = Math.min(lastSelected.idx, idx);
            var to   = Math.max(lastSelected.idx, idx);

            for (var i = from; i <= to; i++)
                data[i].selected = true;

        } else {

            for (var j = 0; j < data.length; j++)
                data[j].selected = false;

            data[idx].selected = true;

            lastSelected = {
                list: listName,
                idx: idx
            };
        }

        if (listName === 'queue')
            renderQueue();
        else
            renderHistory();
    }

    // ── Context menu ───────────────────────────────────────────────────────
    var ctxTargetList = 'queue';

    function showCtxMenu(e, listName) {

        e = e || window.event;

        var x = e.clientX || (e && e.x) || 0;
        var y = e.clientY || (e && e.y) || 0;

        if (e.preventDefault)
            e.preventDefault();

        e.returnValue = false;

        ctxTargetList = listName;

        var menu = document.getElementById('ctx-menu');
        menu.style.display = 'block';
        menu.style.left = x + 'px';
        menu.style.top  = y + 'px';
    }

    function hideCtxMenu() {
        document.getElementById('ctx-menu').style.display = 'none';
    }

    document.onclick = function() { hideCtxMenu(); };

    function getSelectedIds(listName) {
        var data = listName === 'queue' ? queue : history;
        var ids  = [];
        for (var i = 0; i < data.length; i++) {
            if (data[i].selected) ids.push(data[i].id);
        }
        return ids;
    }

    function ctxDelete() {
        hideCtxMenu();
        deleteSelected(ctxTargetList);
    }

    function ctxGong() {
        hideCtxMenu();
        try { window.external.Gong(); } catch(e) {}
    }

    function ctxPrint() {
        hideCtxMenu();
        var data = ctxTargetList === 'queue' ? queue : history;

        // get last selected ticket
        var ticket = null;
        for (var i = data.length - 1; i >= 0; i--) {
            if (data[i].selected) { ticket = data[i]; break; }
        }

        if (!ticket) { alert('No ticket selected.'); return; }

        try {
            var result = window.external.PrintTicket(ticket.id, ticket.number);
            if (result && result.indexOf('error') >= 0) alert('Print error: ' + result);
        } catch(e) {
            alert('PrintTicket failed: ' + e.message);
        }
    }

    function deleteSelected(listName) {
        var ids = getSelectedIds(listName);
        if (ids.length === 0) return;

        var result;
        try {
            result = window.external.DeleteTickets(ids.join(','));
        } catch(e) {
            alert('Delete failed: ' + e.message);
            return;
        }

        if (result && result.indexOf('error') >= 0) {
            alert('Delete error: ' + result);
            return;
        }

        lastSelected = null;
        loadTickets(); // refresh from API
    }

    // ── Delete key ─────────────────────────────────────────────────────────
    document.onkeydown = function(e) {
        e = e || window.event;

        var code = e.keyCode || e.which;

        if (code === 46) { // del
            if (e.preventDefault)
                e.preventDefault();

            e.returnValue = false;
            var isQueue  = document.getElementById('list-queue').className.indexOf('active') >= 0;
            deleteSelected(isQueue ? 'queue' : 'history');
            return false;
        }
    };

    // ── Actions ────────────────────────────────────────────────────────────
    function callNext() {
        try {
            // finish current serving ticket first
            if (servingTicket) {
                var r = window.external.UpdateStatus(servingTicket.id, 'served');
                if (r && r.indexOf('error') >= 0) { alert('Error: ' + r); return; }
            }
            // make first active ticket serving
            if (queue.length > 0) {
                var r2 = window.external.UpdateStatus(queue[0].id, 'serving');
                if (r2 && r2.indexOf('error') >= 0) { alert('Error: ' + r2); return; }
            }
        } catch(e) { alert('callNext failed: ' + e.message); return; }
        loadTickets();
    }

    function setServingStatus(status) {
        if (!servingTicket) return;
        try {
            var r = window.external.UpdateStatus(servingTicket.id, status);
            if (r && r.indexOf('error') >= 0) { alert('Error: ' + r); return; }
        } catch(e) { alert('Status update failed: ' + e.message); return; }
        loadTickets();
    }

    function gong() {
        try {
            var num = servingTicket ? servingTicket.number : '';
            window.external.Gong(num);
        } catch(e) {}
        var btn = document.getElementById('ab-gong');
        btn.style.background = '#fef3cd';
        setTimeout(function() { btn.style.background = ''; }, 400);
    }

    function markSelected(result) {
        var moved = [];
        var remaining = [];
        for (var i = 0; i < queue.length; i++) {
            if (queue[i].selected) {
                moved.push({ number: queue[i].number, calledAt: queue[i].calledAt, result: result, selected: false });
            } else {
                remaining.push(queue[i]);
            }
        }
        queue = remaining;
        for (var j = 0; j < moved.length; j++) history.unshift(moved[j]);
        lastSelected = null;
        renderQueue();
        renderHistory();
    }

    // ── Config ─────────────────────────────────────────────────────────────
    function fillPrinters(selectedValue) {
        var dbg = document.getElementById('printerDebug');
        try {
            var json = window.external.GetPrinters();
            var list = eval('(' + json + ')');
            var sel  = document.getElementById('printer');
            sel.innerHTML = '<option value="">— No printer —</option>';
            for (var i = 0; i < list.length; i++) {
                var opt = document.createElement('option');
                opt.value = list[i]; opt.text = list[i];
                if (list[i] === selectedValue) opt.selected = true;
                sel.appendChild(opt);
            }
            dbg.innerText = '';
        } catch(e) {
            dbg.innerText = 'Printers error: ' + e.message;
        }
    }

    function saveConfig() {
        window.external.SaveConfig('apiUrl',  document.getElementById('apiUrl').value);
        window.external.SaveConfig('printer', document.getElementById('printer').value);
        window.external.SaveConfig('refreshRate', document.getElementById('refreshRate').value);
        var s = document.getElementById('status');
        s.style.display = 'block';
        setTimeout(function() { s.style.display = 'none'; }, 2000);
    }

    function loadCurrent() {
        document.getElementById('apiUrl').value = window.external.GetConfig('apiUrl');
        document.getElementById('refreshRate').value = window.external.GetConfig('refreshRate');
        fillPrinters(window.external.GetConfig('printer'));
        var dbgVal = window.external.GetConfig('printDebug');
        document.getElementById('debugBtn').innerText = 'Debug Print: ' + (dbgVal || 'false');
    }

    function toggleDebug() {
        var cur  = window.external.GetConfig('printDebug');
        var next = (cur === 'true') ? 'false' : 'true';
        window.external.SaveConfig('printDebug', next);
        document.getElementById('debugBtn').innerText = 'Debug Print: ' + next;
    }

    // ── Batch ──────────────────────────────────────────────────────────────
    function loadTypes() {
        var sel = document.getElementById('ticketType');
        try {
            var raw  = window.external.FetchTypes();
            var list = eval('(' + raw + ')');
            if (!(list instanceof Array)) {
                list = list.results || list.types || [list];
            }
            sel.innerHTML = '';
            for (var i = 0; i < list.length; i++) {
                var item = list[i];
                var val  = String(item.id || item.slug || i);
                var name = item.title || item.name || item.display_name || val;
                var opt  = document.createElement('option');
                opt.value = val;
                opt.innerHTML = escHtml(name); // ← was opt.text
                sel.appendChild(opt);
            }
        } catch(e) {
            sel.innerHTML = '<option>Error: ' + e.message + '</option>';
        }
    }

    function createBatch() {
        var typeId = document.getElementById('ticketType').value;
        var count  = parseInt(document.getElementById('count').value, 10);
        var status = document.getElementById('batchStatus');
        if (!typeId || isNaN(count) || count < 1) {
            status.style.display = 'block'; status.style.color = 'red';
            status.innerText = 'Select a type and valid count.'; return;
        }
        status.style.display = 'block'; status.style.color = '#333';
        status.innerText = 'Creating ' + count + ' ticket(s)...';
        var ok = 0, fail = 0;
        for (var i = 0; i < count; i++) {
            try {
                var r = window.external.BatchPress(typeId);
                if (r && r.indexOf('error:') === 0) fail++; else ok++;
            } catch(e) { fail++; }
        }
        status.style.color = fail > 0 ? 'red' : 'green';
        status.innerText = 'Done: ' + ok + ' created' + (fail > 0 ? ', ' + fail + ' failed.' : '.');
    }

    // ── Helpers ────────────────────────────────────────────────────────────
    function now() {
        var d = new Date();
        return d.getHours() + ':' +
               (d.getMinutes() < 10 ? '0' : '') + d.getMinutes() + ':' +
               (d.getSeconds() < 10 ? '0' : '') + d.getSeconds();
    }
    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function formatDate(iso) {
        try {
            // "2026-05-07T21:14:24.761837" → "21:14:24"
            var t = iso.split('T');
            if (t.length > 1) return t[1].substring(0, 8);
            return iso;
        } catch(e) { return iso; }
    }

    // ── Init ───────────────────────────────────────────────────────────────
    // renderQueue();
    // renderHistory();
    startRefresh();
</script>

    z-index:999; min-width:160px; font-size:13px;">
    <div class="ctx-item" id="ctx-gong"   onclick="ctxGong()">&#9679; Gong for selected</div>
    <div class="ctx-item" id="ctx-delete" onclick="ctxDelete()">&#10007; Delete selected</div>
    <div class="ctx-item" id="ctx-print" onclick="ctxPrint()">&#128438; Print selected</div>
</div>
